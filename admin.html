<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FULLTOSS Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#080d18;color:#edf3ff;font:14px system-ui}main{width:min(900px,94%);margin:35px auto}.panel{background:#111b2b;border:1px solid #293b55;border-radius:16px;padding:22px}h1{margin:0 0 8px}.brand{color:#ff405d;font-weight:900;letter-spacing:2px;margin-bottom:22px}p,.muted,.meta{color:#9aabc3;line-height:1.5}input{width:100%;padding:12px;background:#080f1d;color:white;border:1px solid #344963;border-radius:9px}button{background:#ff3655;color:white;border:0;border-radius:9px;padding:10px 15px;font-weight:800;cursor:pointer;margin:6px 6px 6px 0}.secondary,.filter{background:#273a54}.hidden{display:none}.msg{color:#ff9aa9;min-height:20px}.top,.item{display:flex;align-items:center;justify-content:space-between;gap:12px}.list{display:grid;gap:9px;margin-top:16px}.item{padding:13px;border:1px solid #293b55;border-radius:10px;background:#0b1422}.title{font-weight:750}.meta{font-size:12px;margin-top:4px}.filters{margin:12px 0}.active{background:#ff3655}.empty{padding:22px;text-align:center;color:#9aabc3;border:1px dashed #344963;border-radius:10px}@media(max-width:600px){.panel{padding:15px}.item{align-items:flex-start}}
</style></head><body><main><div class="brand">FULLTOSS FC · CONTROL ROOM</div>
<section id="login" class="panel"><h1>Admin Login</h1><p>Login karke har match ka direct share link pao.</p><input id="password" type="password" placeholder="Admin password"><button id="loginBtn">LOGIN</button><div id="loginMsg" class="msg"></div></section>
<section id="dash" class="panel hidden"><div class="top"><div><h1>Match Direct Links</h1><div id="count" class="muted">Loading…</div></div><button id="logout" class="secondary">LOG OUT</button></div><p class="meta">Automatic FanCode match list. Match ID manually enter karne ki zaroorat nahi — bas COPY LINK dabao.</p><div class="filters"><button class="filter active" data-filter="ALL">ALL</button><button class="filter" data-filter="LIVE">LIVE</button><button class="filter" data-filter="UPCOMING">UPCOMING</button></div><div id="list" class="list"><div class="empty">Loading matches…</div></div><div id="msg" class="msg"></div><button id="refresh" class="secondary">REFRESH MATCHES</button></section></main>
<script>
const $=id=>document.getElementById(id);let matches=[],filter="ALL";
async function req(url,opts={}){const r=await fetch(url,{...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})},cache:"no-store"});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.error||"Request failed "+r.status);return d}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){const shown=matches.filter(m=>filter==="ALL"||(filter==="LIVE"?m.status==="LIVE":m.status!=="LIVE"));$("count").textContent=matches.length+" matches · "+matches.filter(m=>m.status==="LIVE").length+" live · "+matches.filter(m=>m.status!=="LIVE").length+" upcoming";$("list").innerHTML=shown.length?shown.map((m,i)=>'<div class="item"><div><div class="title">'+esc(m.title||"Match")+'</div><div class="meta">'+esc(m.tournament||m.category||"FanCode")+' · '+(m.status==="LIVE"?"🔴 LIVE":"UPCOMING")+(m.startTime?" · "+esc(m.startTime):"")+'</div></div><button data-copy="'+i+'">COPY LINK</button></div>').join(""):'<div class="empty">No matches found.</div>'; $("list").querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{const m=shown[Number(b.dataset.copy)];const url=location.origin+"/?match="+encodeURIComponent(m.match_id);try{await navigator.clipboard.writeText(url);b.textContent="COPIED";setTimeout(()=>b.textContent="COPY LINK",1400)}catch(e){window.prompt("Copy match link",url)}})}
async function load(){ $("msg").textContent="";$("list").innerHTML='<div class="empty">Loading matches…</div>';try{const d=await req("/api/feed");matches=Array.isArray(d.matches)?d.matches:[];render();if(!matches.length)$("msg").textContent="Feed se matches nahi mile."}catch(e){$("list").innerHTML='<div class="empty">Match feed load nahi hua.</div>';$("msg").textContent=e.message}}
$("loginBtn").onclick=async()=>{try{await req("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("password").value})});$("password").value="";$("login").classList.add("hidden");$("dash").classList.remove("hidden");load()}catch(e){$("loginMsg").textContent=e.message}};
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click()});
$("logout").onclick=async()=>{await req("/api/admin/logout",{method:"POST"});$("dash").classList.add("hidden");$("login").classList.remove("hidden")};
$("refresh").onclick=load;
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render()});
</script></body></html>
