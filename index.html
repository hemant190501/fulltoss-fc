<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b14">
<title>FULLTOSS FC | Live Sports Arena</title>
<style>
:root{color-scheme:dark;--bg:#070b14;--panel:#0d1524;--line:#26354d;--red:#ff3655;--ice:#b9c8df;--muted:#8292aa}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% -15%,#23385b 0,transparent 42%),radial-gradient(ellipse at 5% 42%,#17274666 0,transparent 35%),var(--bg);color:#f6f8fc;font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#8da4c21a 1px,transparent 1px),linear-gradient(90deg,#8da4c21a 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(to bottom,#000,transparent 78%);z-index:0}
header{height:72px;padding:0 clamp(16px,5vw,76px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff13;background:#080e1be8;backdrop-filter:blur(18px);position:relative;z-index:5}
.brand{font-size:25px;font-weight:1000;letter-spacing:1.8px;color:#fff;text-decoration:none;text-shadow:0 5px 24px #ff365533}.brand span{color:var(--red)}
.header-right{display:flex;align-items:center;gap:12px;color:#aebbd0;font-size:10px;font-weight:850;letter-spacing:1.5px;text-transform:uppercase}
.live-dot{width:8px;height:8px;border-radius:50%;background:#ff3655;box-shadow:0 0 15px #ff3655;animation:pulse 1.5s infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
main{position:relative;z-index:1;width:min(1480px,100%);margin:auto;padding:28px clamp(12px,3vw,42px) 40px}
.hero{position:relative;min-height:218px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:30px clamp(20px,4vw,54px);margin-bottom:24px;border:1px solid #7185a333;border-radius:22px;overflow:hidden;background:linear-gradient(112deg,#121f35ed 0%,#101a2bea 52%,#101829dd 100%);box-shadow:0 22px 70px #0007,inset 0 1px #ffffff14;isolation:isolate}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 80% 50%,#ff36551c,transparent 42%),linear-gradient(120deg,transparent 35%,#8eb4ff08 70%,transparent);z-index:-1}
.eyebrow{display:inline-flex;align-items:center;gap:9px;color:#ff8294;font-size:10px;font-weight:950;letter-spacing:3px;text-transform:uppercase}
h1{font-size:clamp(35px,6vw,66px);line-height:.98;letter-spacing:-3px;margin:13px 0 12px;font-weight:1000}
h1 span{color:var(--red);text-shadow:0 0 35px #ff36554a}
.hero p{margin:0;color:#9eacc1;font-size:13px;letter-spacing:.2px}
.arena{width:190px;height:155px;position:relative;flex:none;perspective:500px}
.orb{position:absolute;width:112px;height:112px;right:30px;top:10px;border-radius:50%;background:radial-gradient(circle at 32% 25%,#ffb3bd 0,#ff536b 13%,#9d1d3b 48%,#25162d 76%);box-shadow:inset -15px -18px 28px #050711,0 0 35px #ff36554d,0 0 85px #ff365522;animation:float 5s ease-in-out infinite;transform-style:preserve-3d}
.orb:after{content:"";position:absolute;inset:17px 9px;border:1px solid #ffd8df66;border-radius:50%;transform:rotate(-28deg) scaleX(.48)}
.ring{position:absolute;width:180px;height:58px;right:-4px;top:48px;border:2px solid #ff6a7d99;border-radius:50%;transform:rotate(-23deg);box-shadow:0 0 18px #ff365533}
.ring.two{width:160px;height:45px;right:5px;top:58px;border-color:#9ab9e566;transform:rotate(32deg)}
@keyframes float{50%{transform:translateY(-10px) rotateY(18deg) rotateZ(8deg)}}
.section-label{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px;color:#dce5f3;font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
.section-label small{color:#74849c;font-size:10px;letter-spacing:1px;font-weight:700}
.frame{position:relative;overflow:hidden;border:1px solid #53678266;border-radius:18px;background:#0b1321;box-shadow:0 25px 80px #0009,0 0 0 1px #ffffff08,inset 0 1px #ffffff14;min-height:680px}
.frame:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,#ff3655,#9ab9e5,transparent);z-index:2;opacity:.8}
iframe{display:block;width:100%;height:calc(100vh - 390px);min-height:680px;border:0;background:#080d18}
.footer{padding:19px 5px 0;text-align:center;color:#65758e;font-size:10px;letter-spacing:1.2px}
@media(max-width:700px){header{height:60px}.brand{font-size:21px}.header-right{font-size:9px;letter-spacing:1px}.hero{min-height:180px;padding:23px 20px;margin-bottom:18px;border-radius:16px}.arena{width:100px;height:110px;transform:scale(.72);transform-origin:center right;margin-left:-20px}h1{font-size:clamp(34px,9vw,48px);letter-spacing:-2px}.hero p{font-size:11px;max-width:245px}.frame{border-radius:13px;min-height:620px}iframe{height:calc(100vh - 270px);min-height:620px}main{padding:16px 9px 26px}.section-label{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
<a class="brand" href="./">FULL<span>TOSS</span> FC</a>
<div class="header-right"><i class="live-dot"></i><span>Live Sports Arena</span></div>
</header>
<main>
<section class="hero">
<div>
<div class="eyebrow"><i class="live-dot"></i> The action starts here</div>
<h1>FEEL THE <span>GAME.</span></h1>
<p>Your matchday destination. Live action, all in one arena.</p>
</div>
<div class="arena" aria-hidden="true"><div class="ring"></div><div class="ring two"></div><div class="orb"></div></div>
</section>
<div class="section-label"><span>Match Centre</span><small>FULLTOSS • FANCode</small></div>
<section class="frame">
<iframe src="https://fulltosslive.pages.dev/fancode.html" title="FULLTOSS FanCode Match Centre" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
</section>
<div class="footer">FULLTOSS FC · BUILT FOR THE LOVE OF SPORT</div>
</main>
</body>
</html>
