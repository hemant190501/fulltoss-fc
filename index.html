<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14">
<title>FULLTOSS FC | Live Sports Arena</title>
<style>
:root{--bg:#070b14;--panel:#0d1728;--line:#263751;--red:#ff3655;--muted:#8b9bb3}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;min-height:100vh;color:#f5f8ff;background:radial-gradient(ellipse at 50% -10%,#314d79 0,transparent 42%),radial-gradient(ellipse at 90% 45%,#571c3540,transparent 30%),#070b14;font-family:Inter,system-ui,Arial,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.17;background-image:linear-gradient(#91a9ca18 1px,transparent 1px),linear-gradient(90deg,#91a9ca18 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(#000,transparent 85%)}
header{height:70px;padding:0 clamp(16px,5vw,76px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff16;background:#080e1be8;backdrop-filter:blur(18px);position:relative;z-index:4}
.brand{font-size:25px;font-weight:1000;letter-spacing:1.5px;color:#fff;text-decoration:none;text-shadow:0 4px 25px #ff365544}.brand span{color:var(--red)}
.status{display:flex;align-items:center;gap:10px;color:#aebbd0;font-size:10px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase}.dot{width:8px;height:8px;border-radius:50%;background:#ff3655;box-shadow:0 0 16px #ff3655;animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}
main{position:relative;z-index:1;width:min(1480px,100%);margin:auto;padding:26px clamp(10px,3vw,42px) 36px}
.hero{position:relative;min-height:235px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:30px clamp(20px,4vw,56px);margin-bottom:23px;border:1px solid #8297b33b;border-radius:22px;overflow:hidden;background:linear-gradient(112deg,#14243ded,#10192beb 60%,#111a2bdf);box-shadow:0 25px 80px #0009,inset 0 1px #ffffff20;isolation:isolate}
.hero:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 78% 50%,#ff36552b,transparent 40%),linear-gradient(115deg,transparent 35%,#a8caff0c 70%,transparent)}
.kicker{display:flex;align-items:center;gap:9px;color:#ff8b9c;font-size:10px;font-weight:950;letter-spacing:3px;text-transform:uppercase}
h1{font-size:clamp(36px,6.2vw,70px);line-height:.96;letter-spacing:-3px;margin:15px 0 12px;font-weight:1000}h1 span{color:var(--red);text-shadow:0 0 36px #ff365566}
.hero p{margin:0;color:#a6b5ca;font-size:13px;letter-spacing:.3px}
.stage{width:240px;height:180px;position:relative;flex:none;perspective:700px}
.ball{position:absolute;z-index:2;width:108px;height:108px;right:65px;top:23px;border-radius:50%;background:radial-gradient(circle at 30% 24%,#ffe2e6 0,#ff6a80 12%,#b52343 47%,#251527 78%);box-shadow:inset -18px -20px 28px #050711,0 0 35px #ff365566,0 0 100px #ff365533;animation:levitate 5s ease-in-out infinite;transform-style:preserve-3d}
.ball:before,.ball:after{content:"";position:absolute;inset:12px 27px;border:2px solid #ffe1e666;border-radius:50%;transform:rotate(35deg)}.ball:after{transform:rotate(-35deg)}
.orbit{position:absolute;width:220px;height:70px;right:7px;top:42px;border:2px solid #ff7187a8;border-radius:50%;transform:rotate(-22deg);box-shadow:0 0 18px #ff365544}.orbit.alt{width:190px;height:56px;right:21px;top:52px;border-color:#a8c7ed88;transform:rotate(32deg)}
.platform{position:absolute;width:185px;height:35px;right:22px;bottom:8px;border:1px solid #ff6c8180;border-radius:50%;transform:rotateX(68deg);box-shadow:0 15px 24px #ff36551c}
@keyframes levitate{50%{transform:translateY(-11px) rotateY(18deg) rotateZ(8deg)}}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:0 4px 11px;color:#e4ecf8;font-size:11px;font-weight:950;letter-spacing:2px;text-transform:uppercase}.sectionhead small{color:#8494ac;font-size:10px;letter-spacing:1px}
.frame{position:relative;overflow:hidden;border:1px solid #63799570;border-radius:18px;background:#0b1321;box-shadow:0 28px 85px #000b,0 0 0 1px #ffffff08,inset 0 1px #ffffff19;min-height:700px}
.frame:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,#ff3655,#9fc5f5,transparent);z-index:2}
iframe{display:block;width:100%;height:calc(100vh - 350px);min-height:700px;border:0;background:#080d18}
.foot{padding:18px 5px 0;text-align:center;color:#71829a;font-size:10px;letter-spacing:1.6px}
@media(max-width:700px){header{height:60px}.brand{font-size:21px}.status{font-size:9px;letter-spacing:1px}.hero{min-height:180px;padding:23px 18px;margin-bottom:17px;border-radius:16px}.stage{width:115px;height:120px;transform:scale(.72);transform-origin:center right;margin-left:-28px}h1{font-size:clamp(34px,9vw,49px);letter-spacing:-2px}.hero p{font-size:11px;max-width:230px}.frame{border-radius:13px;min-height:650px}iframe{height:calc(100vh - 260px);min-height:650px}main{padding:15px 8px 24px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
</style></head>
<body>
<header><a class="brand" href="./">FULL<span>TOSS</span> FC</a><div class="status"><i class="dot"></i> Live Sports Arena</div></header>
<main>
<section class="hero"><div><div class="kicker"><i class="dot"></i> Your front-row seat to the action</div><h1>ENTER THE<br><span>GAME ZONE.</span></h1><p>Live matches. Big moments. One destination.</p></div><div class="stage" aria-hidden="true"><div class="orbit"></div><div class="orbit alt"></div><div class="ball"></div><div class="platform"></div></div></section>
<div class="sectionhead"><span>Match Centre</span><small>LIVE SCORES · MATCH SCHEDULE</small></div>
<section class="frame"><iframe src="https://fulltosslive.pages.dev/fancode.html" title="FULLTOSS live match centre" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe></section>
<div class="foot">FULLTOSS FC · BUILT FOR THE LOVE OF SPORT</div>
</main></body></html>
